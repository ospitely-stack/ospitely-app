<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ospitely</title>
  <script>
    // ============================================================
    // OSPITELY — Trucco SPA per GitHub Pages
    //
    // GitHub Pages è hosting statico: non esiste un vero server che
    // sappia "route" fare per ospitely.com/nome-struttura, perché quel
    // file non esiste davvero sul disco. GitHub Pages, quando non trova
    // un file per un dato path, serve automaticamente questa pagina
    // 404.html — che sfruttiamo per "salvare" il path richiesto e
    // rimandare tutto verso index.html, dove il vero router (client-side,
    // dentro l'app React) lo legge e decide cosa mostrare.
    //
    // Riferimento standard per questa tecnica:
    // https://github.com/rafgraph/spa-github-pages
    // ============================================================

    var percorsoRichiesto = location.pathname + location.search + location.hash;

    // Salva il percorso originale in sessionStorage: sopravvive al
    // redirect verso index.html, che lo legge e ripristina l'URL vero
    // tramite history.replaceState (vedi commento in index.html)
    sessionStorage.setItem('ospitely_percorso_originale', percorsoRichiesto);

    location.replace('/');
  </script>
</head>
<body>
  <!-- Contenuto minimo, mostrato solo per la frazione di secondo
       prima del redirect automatico -->
  Reindirizzamento in corso...
</body>
</html>
